id":1,"image":"","label_color":"#B5D913","label_name_en":"Game","message":"11/19 12:00ごろに行うアップデート後、Google Play版のゲームプレイに必要なデータ約7GBの再ダウンロードが発生いたします。\u003cbr>すでにダウンロードいただいているデータも再度ダウンロードいただく必要がございます。あらかじめご了承ください。\u003cbr>データを再度ダウンロードしても、端末のストレージ使用量が増大することはございません。\u003cbr>\u003cbr>本件に関してお手間をおかけするお詫びとして、Google Play版をご利用のお客様にジュエル150個の配布を予定しております。\u003cbr>お詫びを配布次第、本お知らせにてご報告いたします。\u003cbr>\u003cbr>ご利用のお客様に、ご迷惑をおかけしますことを、お詫び申し上げます。","message_english":"Following the update scheduled for around 12:00 PM on November 19, you will need to re-download approximately 7 GB of data required to play the Google Play version of the game.\u003cbr> You will need to re-download data that you have already downloaded. We appreciate your understanding.\u003cbr> Redownloading the data will not increase the amount of storage space used on your device.\u003cbr>\u003cbr> As an apology for the inconvenience caused by this issue, we plan to distribute 150 Gems to users of the Google Play version.\u003cbr> We will post an update here as soon as the compensation has been distributed.\u003cbr>\u003cbr> We apologize for any inconvenience this may cause to our users.","post_at":1794565200,"post_platform_flag":20,"row_number":1,"title":"Google Play版アップデートに伴うデータの再ダウンロードに関するお知らせ","title_english":"Notice Regarding the Redownload of Data Following the Google Play Update","update_at":null},{"announce_id":155,"announce_label":1,"article_image":null,"id":1,"image":"","label_color":"#B5D913","label_name_en":"Game","message":"現在、ゲーム内において、下記の不具合が発生しております。\u003cbr>\u003cbr>■現在確認している不具合\u003cbr>【11/13 19:00追記】\u003cbr>\u003cdiv class=\"postscript-01\">・[ホーム設定]で特定のウマ娘を設定した際に、一部衣装でモデルの表示が意図しないものになる。 \u003c/div>\u003cbr>【11/11 19:00追記】\u003cbr>\u003cdiv class=\"postscript-01\">・ウマ娘詳細において、特定の条件下で[練習パートナー登録]ボタンを選択すると、「エラーコード：500」が表示されてタイトル画面に移動する場合がある。\u003c/div>\u003cbr>【11/11 16:10追記】\u003cbr>\u003cdiv class=\"postscript-01\">・[ストーリー]＞[エクストラ]＞[シーズンイベント]＞「KIRARI MAGIC SHOW」において、第2話「エンディング」を再生した後にライブが再生されない。\u003c/div>\u003cbr>【11/9 18:35追記】\u003cbr>\u003cdiv class=\"postscript-01\">・一部のレースにおいて、カメラがウマ娘のいない場所を映し続ける場合がある。\u003c/div>\u003cbr>【11/9 17:00追記】\u003cbr>\u003cdiv class=\"postscript-01\">・「殿堂入りウマ娘一覧」画面で[移籍]ボタンを選択後に「ウマ娘詳細」を表示した際、特定の操作を行うとウマ娘アイコンが意図しない表示になる場合がある。\u003c/div>\u003cbr>【11/9 15:05追記】\u003cbr>\u003cdiv class=\"postscript-01\">・育成シナリオ「朋、史解き　―午式駿大祭―」の進捗発表会画面において、一部端末で表示が崩れる場合がある。\u003c/div>\u003cbr>【11/6 18:40追記】\u003cbr>\u003cdiv class=\"postscript-01\">・育成シナリオ「朋、史解き　―午式駿大祭―」の育成イベント「ウマ娘とヒトと」において、ワンダーアキュートが意図しない表示になる。\u003c/div>\u003cbr>【11/6 16:40追記】\u003cbr>\u003cdiv class=\"postscript-01\">・育成シナリオ「Make a new track!!～クライマックス開幕～」において、コンディション「勉強家」を獲得している場合、育成グッズ「博学帽子」が使用できない。\u003c/div>\u003cbr>【11/5 18:40追記】\u003cbr>\u003cdiv class=\"postscript-01\">・下記の画面において、[下へ]ボタンを選択した後に優先度を別のタブへ変更すると、ボタンが[下へ]に切り替わらない。\u003cbr>スキルセットの「スキル優先順位」\u003cbr>育成プランシートの「目標スキル優先順位」および「目標汎用因子優先順位」\u003c/div>\u003cbr>【11/4 18:10追記】\u003cbr>\u003cdiv class=\"postscript-01\">・一部の端末において、一部育成シナリオの育成トップでスキルPtが5桁を超えた際、意図しない表示になる場合がある。\u003cbr>※本不具合は表示上の不具合であり、実際の獲得スキルPtに不具合はありません。\u003c/div>\u003cbr>【11/4 10:45追記】\u003cbr>\u003cdiv class=\"postscript-01\">・レース前のパドックでの実況において、出走するウマ娘の名前が正しく再生されない。\u003c/div>\u003cbr>【11/2 14:45追記】\u003cbr>\u003cdiv class=\"postscript-01\">・下記ウマ娘において、継承専用ウマ娘アイコンが意図しないものになっている。\u003cbr>[トップ・オブ・ブルー]ダイワスカーレット\u003cbr>[ストレート・ライン]メジロライアン\u003c/div>\u003cbr>【10/28 19:30追記】\u003cbr>\u003cdiv class=\"postscript-01\">・育成シナリオ「Beyond Dreams 共に前へ、共に光を」において、特定の操作を行うとトレーニングで獲得できるパラメータの表示が意図しないものになる。\u003cbr>※本不具合は表示上の不具合であり、実際に獲得できる基礎能力やスキルPtに不具合はございません。\u003c/div>\u003cbr>【10/28 14:40追記】\u003cbr>\u003cdiv class=\"postscript-01\">・育成シナリオ「朋、史解き　―午式駿大祭―」の教えセットにおいて、特定の手順を行った際に、変更した自動呼び出しの設定が反映されない場合がある。\u003c/div>\u003cbr>【10/26 14:10追記】\u003cbr>\u003cdiv class=\"postscript-01\">・育成シナリオ「朋、史解き　―午式駿大祭―」のトレーニング画面において、一部の端末で教えのアイコンが意図しない表示になる場合がある。\u003cbr>※本不具合は表示上の不具合であり、実際に獲得できるトレーニング効果に不具合はありません。\u003cbr>・育成シナリオ「朋、史解き　―午式駿大祭―」の教え伝受画面において、一部のAndroid端末で意図しない表示になる。\u003cbr>・育成シナリオ「朋、史解き　―午式駿大祭―」において、「午式駿大祭」演出の一部挙動が意図しないものになっている。\u003cbr>・育成シナリオ「朋、史解き　―午式駿大祭―」の進捗発表会画面において、開始ボタンの表示が意図しないものになっている。\u003c/div>\u003cbr>【10/19 12:00追記】\u003cbr>\u003cdiv class=\"postscript-01\">・継承ウマ娘選択画面の[ウマ娘]タブにおいて、表示設定の[ソート]に「フォロー順」が表示される場合がある。\u003c/div>\u003cbr>【10/15 11:20追記】\u003cbr>\u003cdiv class=\"postscript-01\">・「継承専用ウマ娘まとめて獲得」において、特定の手順を行ってから「前回の設定でまとめて獲得」を選択すると、画面が正しく表示されず進行不能になる場合がある。\u003cbr>※本不具合が発生した場合、アプリを再起動して、新規で「まとめて獲得」を実行するか他の獲得プランを実行することで解消されます。\u003c/div>\u003cbr>【10/6 15:55追記】\u003cbr>\u003cdiv class=\"postscript-01\">・[覚醒Lv強化]において、覚醒Lvアップの際に特定の操作を行うと覚醒Lvの表示が意図しない表示になる場合がある。\u003cbr>※本不具合は表示上の不具合であり、覚醒Lvの強化状況に影響はありません。\u003cbr>※本不具合が発生した場合、再度[ホーム]＞[強化編成]＞[育成ウマ娘]＞[覚醒Lv強化]を開くことで解消されます。\u003c/div>\u003cbr>【10/1 17:45追記】\u003cbr>\u003cdiv class=\"postscript-01\">・下記のイベントバナーやボタンの右上に、意図しないタイミングでバッジが表示される場合がある。\u003cbr>※本不具合は表示上の不具合であり、エントリーチケットや限定ミッションの報酬の獲得に不具合はありません。\u003cbr>\u003cbr>▼対象箇所\u003cbr>・ホーム画面右上の[チャンピオンズミーティング]のバナー\u003cbr>・ホーム画面フッターの[レース]\u003cbr>・ホーム画面の「レース」にある[レースイベント]および[チャンピオンズミーティング]\u003c/div>\u003cbr>【9/25 16:00追記】\u003cbr>\u003cdiv class=\"postscript-01\">・「発動スキルの確認」において、追い比べの「○％地点」の表記が100%を越えて表示される場合がある。\u003cbr>※本不具合は表示上の不具合であり、レースの展開に影響はありません。\u003c/div>\u003cbr>【9/24 18:05追記】\u003cbr>\u003cdiv class=\"postscript-01\">・継承専用ウマ娘の「ウマ娘詳細」において、継承履歴の人数が正しく表示されない場合がある。\u003cbr>※本現象が発生した場合、アプリを再起動することで解消されます。\u003c/div>\u003cbr>【9/24 16:50追記】\u003cbr>\u003cdiv class=\"postscript-01\">・[メニュー]＞[オプション]＞[レース]＞「ファンファーレサウンド」において、「JRA/地方競馬版」を保存した際に表示される「設定完了」ポップアップで[キャンセル]を選択すると、マスターボリュームが意図しない設定になる場合がある。\u003cbr>※本不具合が発生した場合、再度[メニュー]＞[オプション]を開くことで解消されます。\u003c/div>\u003cbr>【9/24 15:25追記】\u003cbr>\u003cdiv class=\"postscript-01\">・「継承専用ウマ娘一覧」画面において、特定の手順を行ってから[移籍]ボタンを選択すると、「特別移籍」の画面へ移動する場合がある。&nbsp;\u003c/div>\u003cbr>【9/11 12:40追記】\u003cbr>\u003cdiv class=\"postscript-01\">・イベント「アグネスタキオンの究極因子研究」において、アグネスタキオンにみせる際の「ウマ娘確認」ポップアップで、アイテムアイコンを長押ししてもアイテムの説明が表示されない。\u003c/div>\u003cbr>【9/11 12:20追記】\u003cbr>\u003cdiv class=\"postscript-01\">・[プロフィール/トレーナー名刺]＞チームランクの[詳細]から確認できるチーム詳細画面において、特定の操作を行うと一部の称号が意図しないタイミングで表示される。\u003c/div>\u003cbr>【9/9 16:00追記】\u003cbr>\u003cdiv class=\"postscript-01\">・イベント「レジェンドレース VSバンブーメモリー」および「レジェンドレース VSケイエスミラクル」のファンファーレが意図しないものになっている。\u003c/div>\u003cbr>【8/17 19:00追記】\u003cbr>\u003cdiv class=\"postscript-01\">・クレーンゲームにおいて、一部ウマ娘ぬいぐるみの表示が意図しないものになる場合がある。\u003c/div>\u003cbr>【8/10 11:45追記】\u003cbr>\u003cdiv class=\"postscript-01\">・イベント「レジェンドレース VSデュランダル」に出走するデュランダルとアストンマーチャンの所持スキルが意図しない内容になっている。\u003c/div>\u003cbr>【8/7 19:05追記】\u003cbr>\u003cdiv class=\"postscript-01\">・自主トレ育成中の[編成詳細]＞[イベントボーナスウマ娘]＞[詳細]において、ボーナスウマ娘詳細ダイアログ内の表示が崩れる場合がある。\u003c/div>\u003cbr>【7/24 19:30追記】\u003cbr>\u003cdiv class=\"postscript-01\">・育成において、サポート編成を変更後に育成を開始した際、特定の操作を行うと次回育成時に前回のサポート編成の変更内容が反映されない場合がある。\u003c/div>\u003cbr>【7/13 18:50追記】\u003cbr>\u003cdiv class=\"postscript-01\">・育成シナリオ「らっしゃい！トレセン軒！ ～恩返し、始めました～」のおまかせ育成において、サポートカードのイベントで一時停止した後、「隠し味の秘訣所持中」のポップアップが表示されると、おまかせ育成が正しく進行しない場合がある。\u003c/div>\u003cbr>【7/13 12:25追記】\u003cbr>\u003cdiv class=\"postscript-01\">・一部の育成シナリオの下記レースにおいて、出走するウマ娘が意図していない設定になっている。\u003cbr>「若駒ステークス」\u003cbr>「若葉ステークス」\u003c/div>\u003cbr>【6/29 14:20追記】\u003cbr>\u003cdiv class=\"postscript-01\">・DMM GAMES版およびSteam版の自主トレ育成において、「自主トレ育成ログ」が表示されている画面でキーボードを使ってカーソルを移動させると、意図しない箇所にカーソルが合う場合がある。\u003c/div>\u003cbr>【5/29 14:55追記】\u003cbr>\u003cdiv class=\"postscript-01\">・一部端末において、トレーニングを実行した際に、一部演出で表示が崩れる場合がある。\u003c/div>\u003cbr>【5/20 19:35追記】\u003cbr>\u003cdiv class=\"postscript-01\">・スキルフィルターにおいて、スキル「聖女の挑戦」の絞り込みが正しく機能しない場合がある。\u003c/div>\u003cbr>【5/8 15:15追記】\u003cbr>\u003cdiv class=\"postscript-01\">・イベント「レジェンドレース VSウイニングチケット」に出走するウイニングチケットの所持スキルが意図しない内容になっている。\u003c/div>\u003cbr>【4/24 17:57追記】\u003cbr>\u003cdiv class=\"postscript-01\">・DMM GAMES版およびSteam版の「横画面モード」において、育成中に特定の条件下でジュークボックスの操作を行うとBGMの再生が意図しない挙動になる場合がある。\u003cbr>※本不具合が発生した場合、アプリを再起動することで解消されます。\u003c/div>\u003cbr>【4/10 12:00追記】\u003cbr>\u003cdiv class=\"postscript-01\">・育成イベントギャラリーの[選択して連続再生]において、ラッキーライラックの育成イベント「秋華賞にむけて」および「ジャパンCにむけて」が意図しない内容で再生される場合がある。\u003c/div>\u003cbr>【4/6 16:50追記】\u003cbr>\u003cdiv class=\"postscript-01\">・育成シナリオ「収穫ッ！満腹ッ！大豊食祭」において、各トレーニングのボタンが意図しない表示になる場合がある。\u003cbr>※本不具合は表示上の不具合であり、実際に獲得できるお手入れスタンプやトレーニング効果に不具合はございません。\u003c/div>\u003cbr>【4/1 15:55追記】\u003cbr>\u003cdiv class=\"postscript-01\">・ホーム画面において、特定条件下で一部キャラクターの表示が意図しないものになる。\u003c/div>\u003cbr>【3/23 11:30追記】\u003cbr>\u003cdiv class=\"postscript-01\">・一部端末において、 ライブやスキルカットインを再生した際に、一部演出で表示が崩れる場合がある。\u003c/div>\u003cbr>【3/3 18:14追記】\u003cbr>\u003cdiv class=\"postscript-01\">・DMM GAMES版およびSteam版の「横画面モード」において、ホーム画面の新規トークを再生しても、画面右側のメニューの「ウマ娘名鑑」ボタンに「NEW」アイコンが表示されない場合がある。\u003cbr>※本不具合は表示上の不具合であり、再生したトークは[ウマ娘名鑑]＞[トークギャラリー]に解放されます。\u003c/div>\u003cbr>【3/2 14:20追記】\u003cbr>\u003cdiv class=\"postscript-01\">・一部の育成イベント、ストーリー、およびホームのトークにおいて、特定条件下でキャラクターの表示が意図しないものになる。\u003c/div>\u003cbr>【2/27 11:10追記】\u003cbr>\u003cdiv class=\"postscript-01\">・育成において、一部の育成イベントで特定の操作を行うと進行不能になる場合がある。\u003cbr>※本不具合が発生した場合、アプリを再起動することで解消されます。\u003c/div>\u003cbr>【2/24 12:00追記】\u003cbr>\u003cdiv class=\"postscript-01\">・育成シナリオ「Beyond Dreams 共に前へ、共に光を」の振り返り画面において、一部ウマ娘が意図しない表示になる場合がある。\u003c/div>\u003cbr>【2/19 18:45追記】\u003cbr>\u003cdiv class=\"postscript-01\">・「リーグ オブ ヒーローズ」において、[ランキング]＞[自分の順位]における表示が意図しないものになる場合がある。\u003cbr>・「リーグ オブ ヒーローズ」において、ランキング画面に移動しようとする際に通信エラーが発生する場合がある。\u003c/div>\u003cbr>【2/10 11:05追記】\u003cdiv class=\"postscript-01\">・育成において、一部の育成イベントでテキストの表示速度が意図しないものになる。\u003c/div>\u003cbr>【11/19 12:48追記】\u003cbr>\u003cdiv class=\"postscript-01\">・ルームマッチの[マイ出走リスト]において、特定の条件下で設定中のウマ娘と同じお試しウマ娘が設定できる場合がある。また、その状態でほかの画面に移動すると、エラーが発生しタイトル画面に移動する。\u003c/div>\u003cbr>【11/4 19:25追記】\u003cbr>\u003cdiv class=\"postscript-01\">・育成において、一部の育成イベントで画面が明転または暗転したまま終了する。\u003c/div>\u003cbr>【10/29 12:40追記】\u003cbr>\u003cdiv class=\"postscript-01\">・育成シナリオ「ごくらく♪ゆこま温泉郷」において、湯浴み会の[入浴♪]選択時にキャラクターの表示が崩れる場合がある。\u003cbr>・一部楽曲のライブにおいて、一部の歌唱が正しく再生されない場合がある。\u003c/div>\u003cbr>【10/27 16:55追記】\u003cbr>\u003cdiv class=\"postscript-01\">・レースにおいて、ゲートイン時の実況内容が「主な優勝歴」と異なる場合がある。&nbsp;\u003c/div>\u003cbr>【10/7 10:45追記】\u003cbr>\u003cdiv class=\"postscript-01\">・一部の端末において、全国興行で[まとめて完了確認]を選択し移動した興行完了画面で、別の興行へ切り替えた際に親愛度アイコンの表示が崩れる場合がある。&nbsp;\u003c/div>\u003cbr>【10/1 12:25追記】\u003cbr>\u003cdiv class=\"postscript-01\">・レースイベント「チャンピオンズミーティング」において、決勝ラウンド出走後に[ランキング]からウマ娘詳細を表示した際、[育成情報]の獲得スキルPtが0ptと表示される。\u003c/div>\u003cbr>【9/24 17:46追記】\u003cbr aria-hidden=\"true\">\u003cdiv class=\"postscript-01\">・DMM GAMES版、Steam版において、ゲームサウンドが正常に再生されなくなる場合がある。&nbsp;\u003c/div>\u003cbr>【9/10 18:11追記】\u003cdiv class=\"postscript-01\">・DMM GAMES版において、アプリ起動時に前回終了時と異なる位置にウィンドウが表示される場合がある。\u003c/div>\u003cbr>【9/5 16:40追記】\u003cbr>\u003cdiv class=\"postscript-01\">・育成シナリオ「無人島へようこそ -DESIGN YOUR ISLAND-」において、一部の育成ウマ娘でおまかせ育成を行うと、クラシック級1月前半に育成イベント「新年の抱負」が発生した際、進行不能になる場合がある。\u003cbr>※本不具合が発生した場合、アプリを再起動することで解消されます。\u003cbr>・Steam版の育成シナリオ「無人島へようこそ -DESIGN YOUR ISLAND-」の育成トップにおいて、画面右側のメニューから「ローテーション」を選択してレースの予約や予約取り消しを行うと、島トレが実行可能であることを示すアイコンが正しく表示されない。\u003cbr aria-hidden=\"true\">※本不具合は表示上の不具合であり、島トレは正常に実行できます。&nbsp;\u003c/div>\u003cbr>【8/29 18:50追記】\u003cbr>\u003cdiv class=\"postscript-01\">・グランアレグリアの育成において、特定のレースで発生する実況が発生しない。\u003c/div>\u003cbr>【8/24 12:25追記】\u003cbr>\u003cdiv class=\"postscript-01\">・トレーナー手帳において、[方針]選択後のポップアップでデイリーレースの出走レースを選択する際、スキップ未解放のレースが表示されない。\u003cbr>・トレーナー手帳において、一部のコンテンツの「スキップ結果」のポップアップで、「所持上限を超えた報酬はプレゼントに送られます」が表示されない場合がある。\u003cbr>・トレーナー手帳において、一部のコンテンツのスキップ中にエラーが発生すると、意図しない画面に移動する場合がある。\u003cbr>・トレーナー手帳において、全国興行の「スキップ結果」のポップアップで、一部のアイテムアイコンを長押ししてもアイテムの説明が表示されない。\u003cbr>・トレーナー手帳において、全国興行のスキップ中に、意図しない効果音が再生される場合がある。\u003cbr>・トレーナー手帳において、スキップ演出中に一部のミニキャラの表示が崩れる場合がある。\u003c/div>\u003cbr>【7/31 11:05追記】\u003cbr>\u003cdiv class=\"postscript-01\">・おまかせ育成において、育成イベントのスキップが解除されても、次の育成イベント開始時にスキップされる場合がある。\u003c/div>\u003cbr>【7/28 17:55追記】\u003cbr>\u003cdiv class=\"postscript-01\">・おまかせ育成において、プラン詳細に表示される優先スキルの順番が入れ替わる場合がある。\u003cbr>※本不具合は表示上の不具合であり、優先スキルの順番は自動での育成に影響はありません。\u003c/div>\u003cbr>【7/25 17:30追記】\u003cbr>\u003cdiv class=\"postscript-01\">・メインストーリーの一部のレースにおいて、特定条件を満たしたウマ娘を出走させると発走前の実況で意図しない内容が表示されてしまう。&nbsp;\u003c/div>\u003cbr>【7/2 19:30追記】\u003cbr>\u003cdiv class=\"postscript-01\">・DMM GAMES版およびSteam版において、テキストを入力できる画面で、入力カーソルが表示位置によって意図しない色で表示される。\u003cbr>※本不具合は表示上の不具合であり、テキストの入力は正常に行えます。\u003cspan data-sk=\"tooltip_parent\" dir=\"ltr\">&nbsp;\u003c/span>\u003c/div>\u003cbr>【6/30 22:50追記】\u003cbr>\u003cdiv class=\"postscript-01\">&nbsp;・育成シナリオ「無人島へようこそ -DESIGN YOUR ISLAND-」において、島トレ券を使いきれない場合に表示されるポップアップの表示タイミングが意図しないものになる場合がある。\u003c/div>\u003cbr>【6/27 12:30追記】\u003cdiv class=\"postscript-01\">・Steam版の育成シナリオ「無人島へようこそ -DESIGN YOUR ISLAND-」において、育成イベント「島トレーニングができるぞ！」の進行中に[ジュークボックス]を選択すると表示が崩れる場合がある。\u003c/div>\u003cbr>【6/25 19:10追記】\u003cbr>\u003cdiv class=\"postscript-01\">・Steam版の育成において、育成イベント中に意図せずジュークボックスのTIPSが表示される場合がある。\u003cbr>※本不具合が発生すると、育成イベントが意図しない表示になる、または進行不能になる場合があります。\u003cbr>※本不具合が発生した場合、アプリを再起動することで解消されます。\u003cbr>・Steam版の育成シナリオ「収穫ッ！満腹ッ！大豊食祭」において、ゲームパッドで「畑」を操作した際に、意図しないボタンにカーソルが合う場合がある。\u003cbr>・Steam版の育成シナリオ「アオハル杯～輝け、チームの絆～」において、アオハル杯開始の演出が意図しないものになる場合がある。\u003cbr>・Steam版の[メニュー]において、ボタンに「！」のバッジが表示された状態でウィンドウサイズを変更すると、「！」のバッジが意図しない表示になる。\u003cbr>・Steam版のサークルにおいて、ゲームパッドの方向パッドを使ってカーソルを移動させると、画面から見切れているキャラクターにカーソルが合う場合がある。\u003cbr>・一部端末において、Steam版のゲームパッドの左スティックや方向パッドでカーソルを動かすと、カーソルの表示が意図しないものになる場合がある。\u003c/div>\u003cbr>【6/19 18:00追記】\u003cbr>\u003cdiv class=\"postscript-01\">・ルームマッチの[詳細モード]において、特定の操作を行うと[ルーム名]と[メッセージ]に入力した内容が意図しないものになる場合がある。\u003cbr>※本不具合は表示上の不具合であり、ほかのトレーナーに表示される内容に影響はありません。\u003c/div>\u003cbr>【6/13 19:15追記】\u003cbr>\u003cdiv class=\"postscript-01\">・トレーナーガイドにおいて、7月下旬開催予定のチャンピオンズミーティングに対して意図しない更新ポップアップが表示される場合がある。\u003cbr>※7月下旬開催予定のチャンピオンズミーティングにおけるトレーナーガイドには、スキル「夢の舞台へ」「光明」の追加以外の変更はございません。\u003c/div>\u003cbr>【5/27 18:50追記】\u003cbr>\u003cdiv class=\"postscript-01\">・育成において、「目標レースのレース戦績を達成していないとき適性が合うレースに出走する」制御を使用しておまかせ育成を行うと、目標のレース戦績の条件に合致するレースが開催中のターンに、目標の条件に合致せず適性が高いレースに出走する場合がある。\u003c/div>\u003cbr>【4/28 17:03追記】\u003cbr>\u003cdiv class=\"postscript-01\">・「The Twinkle Legends」の「トゥインクル・シリーズの盛り上がり」演出再生直前の育成イベントにおいて、特定の操作を行うと進行不能になる場合がある。\u003cbr>※本不具合が発生した場合、アプリを再起動することで解消されます。\u003c/div>\u003cbr>【4/16 12:12追記】\u003cbr>\u003cdiv class=\"postscript-01\">・[ストーリー]＞[エクストラ]＞[ムービー]において、「CMムービー」を再生する際にウマ娘の衣装が意図しない表示になる場合がある。\u003cbr>※本不具合が発生した場合、[メニュー]＞[オプション]＞[育成]の[育成中のレース衣装の設定]から「GⅡ以下のレースは体操服」をOFFに設定すると解消されます。\u003c/div>\u003cbr>【4/10 14:40追記】\u003cbr>\u003cdiv class=\"postscript-01\">・ノースフライトの育成において、サポートカードイベント終了時に表示されるノースフライトのモーションが、意図しない表示になる場合がある。\u003c/div>\u003cbr>【3/21 14:55追記】\u003cbr>\u003cdiv class=\"postscript-01\">・育成トップにおいて、ヒントを表示した状態で他画面に移動すると、ヒントが意図しない表示になる場合がある。\u003c/div>\u003cbr>【3/10 18:50追記】\u003cbr>\u003cdiv class=\"postscript-01\">・「SNS共有」で投稿されたURLからアプリを起動した際に、専用のポップアップが表示されない場合がある。\u003c/div>\u003cbr>【2/27 15:35追記】\u003cbr>\u003cdiv class=\"postscript-01\">・育成完了後の育成ランク表示演出において、特定の操作を行うと演出が正常に表示されない場合がある。\u003c/div>\u003cbr>【2/24 12:00追記】\u003cbr>\u003cdiv class=\"postscript-01\">・育成内の一部演出において、一部の端末で表示が崩れる場合がある。\u003cbr>・育成において、おまかせ育成を行っている際に画面切り替えが行われると、画面下部が意図しない表示になる場合がある。\u003c/div>\u003cbr>【2/21 16:00追記】\u003cbr>\u003cdiv class=\"postscript-01\">・DMM GAMES版のテキスト入力画面において、特定の手順で文字を入力した際、意図しない内容で入力される。\u003c/div>\u003cbr>【2/10 16:35追記】\u003cbr>\u003cdiv class=\"postscript-01\">・タイトル画面右下の「メニュー」&gt;[データ整理]において、端末の空き容量がない状態で実行した際、進行不能となる場合がある。\u003cbr>※本不具合が発生した場合、端末の空き容量を確保したうえで、アプリを再起動することで解消されます。\u003c/div>\u003cbr>【1/15 15:40追記】\u003cbr>\u003cdiv class=\"postscript-01\">・Android端末「Xiaomi」および「Redmi Note」の一部において、「ゲームターボ」のGPU設定を「節電」または「バランス」にしている場合、ゲーム画面が正常に表示されない。\u003cbr>※本不具合は「ゲームターボ」のGPU設定を見直すことで改善される場合があります。\u003c/div>\u003cbr>【1/8 12:40追記】\u003cbr>\u003cdiv class=\"postscript-01\">・サウンズオブアースの育成イベント「温泉旅行」にて、サウンズオブアースの髪が意図しない表示になる場合がある。\u003c/div>\u003cbr>【12/12 16:30追記】\u003cbr>\u003cdiv class=\"postscript-01\">・グラスワンダーの一部育成イベントにおいて、意図しない背景で終了する場合がある。\u003c/div>\u003cbr>【11/14 12:40追記】\u003cbr>\u003cdiv class=\"postscript-01\">・継承ウマ娘選択画面や育成中の[編成情報]において、レンタルウマ娘の因子の★の数が少なく表示される場合がある。\u003cbr>※本不具合は表示上の不具合であり、発動した因子の効果や、育成完了時の継承ウマ娘が持っている因子に不具合はございません。\u003c/div>\u003cbr>【10/11 19:55追記】\u003cbr>\u003cdiv class=\"postscript-01\">・イベント「レーシングカーニバル」のチャレンジレースにおいて、「主な報酬」に表示される一部報酬に「x個数」の表示がされていない。\u003cbr>※本不具合は表示上の不具合であり、実際に獲得できる個数に不具合はございません。\u003c/div>\u003cbr>【8/24 15:43追記】\u003cbr>\u003cdiv class=\"postscript-01\">・KFCさんぽキャンペーンのおさんぽ演出にて、一部の演出で食べ物や持ち物が表示されない場合がある。\u003c/div>\u003cbr>【7/24 18:10追記】\u003cbr>\u003cdiv class=\"postscript-01\">・「リーグ オブ ヒーローズ」において、メインステージのファンファーレが意図しないものになっている。\u003c/div>\u003cbr>【7/1 16:05追記】\u003cbr>\u003cdiv class=\"postscript-01\">・アプリ起動中に電話を受信し、特定の手順を行ってから電話を切ると、以降のゲームサウンドが再生されなくなる。\u003cbr>※本不具合発生中にライブシアターにてライブを再生しようとした際、進行不能になります。\u003cbr>※ゲームサウンドが再生されなくなる現象や、進行不能については、アプリを再起動することで解消されます。\u003c/div>\u003cbr>【6/7 17:01追記】\u003cbr>\u003cdiv class=\"postscript-01\">・Android端末において、育成イベント進行中にコントロールセンターを開くと進行不能になる場合がある。\u003cbr>※進行不能になった場合、再度コントロールセンターを開くことで解消されます。\u003c/div>\u003cbr>【5/15 14:20追記】\u003cbr>\u003cdiv class=\"postscript-01\">・レースにおいて、カメラがウマ娘のいない場所を映し続ける場合がある。\u003c/div>\u003cbr>【4/26 12:15追記】\u003cbr>\u003cdiv class=\"postscript-01\">・サウンズオブアースの勝利時のモーションで髪が意図しない表示になる場合がある。\u003c/div>\u003cbr>【4/18 21:15追記】\u003cbr>\u003cdiv class=\"postscript-01\">・一部のレースにおいて、ほかのトレーナーが出走させたウマ娘のモーションが意図しない表示になる場合がある。\u003c/div>\u003cbr>【3/27 17:40追記】\u003cbr>\u003cdiv class=\"postscript-01\">・育成において、特定の条件下でBGMが再生されない場合がある。\u003c/div>\u003cbr>【3/21 14:15追記】\u003cbr>\u003cdiv class=\"postscript-01\">・メインストーリー第2部の一部イベントシーンにおいて、一部の端末で動作が遅くなる場合がある。\u003c/div>\u003cbr>【3/11 12:45追記】\u003cbr>\u003cdiv class=\"postscript-01\">・「マンスリーマッチ」において、CLASS10でCLASS Ptが1以上の場合、獲得したCLASS Ptが0ptでも効果音が再生される。\u003c/div>\u003cbr>【2/27 18:50追記】\u003cbr>\u003cdiv class=\"postscript-01\">・ミニキャラが表示される演出において、一部ミニキャラの表示が崩れる場合がある。\u003c/div>\u003cbr>【2/24 14:15追記】\u003cbr>\u003cdiv class=\"postscript-01\">・新オープニングムービー「U.M.A. NEW WORLD!!」を再生する際、表示が崩れる場合がある。\u003c/div>\u003cbr>【2/24 12:26追記】\u003cbr>\u003cdiv class=\"postscript-01\">・「U.A.F. Ready GO! ～アスリートのキ que Skill)\u003cbr> ・Luck is Coming! (Inherited Skill)\u003cbr> ・Walk Supreme (Inherited Skill)\u003cbr> ・Punkish Bite (Unique Skill)\u003cbr> ・Into High Gear! (Unique Skill)\u003cbr> ・Into High Gear! (Inherited Skill)\u003cbr> ・Longing Beyond the Sakura! (Inherited Skill)\u003c/div>\u003cbr> [Updated 9/11 at 12:40]\u003cbr>\u003cdiv class=\"postscript-01\"> ・In the Trainer’s Notes, the display order of some of Admire Groove’s (Common) voice lines is incorrect.\u003cbr> ・On certain screens within “Daily Races,” “Daily Legend Races,” and “Team Arena,” the border around the Umamusume icon may not display correctly.\u003c/div>\u003cbr> [Updated 9/11 at 12:30]\u003cbr>\u003cdiv class=\"postscript-01\"> ・In the [Main Scenario] section of the Training Event Gallery, some events that should not be unlockable with Gallery Keys can currently be unlocked using them.\u003c/div>\u003cbr> [Updated 9/9 16:47]\u003cbr>\u003cdiv class=\"postscript-01\"> ・In Room Matches, if you load a saved “My Race” condition, change only the “Special Rules” settings, and then save it again, the changes are not applied correctly.\u003cbr> ・On some Android devices, character positions may appear misaligned on certain screens.\u003cbr> ・In the Training Scenario “Welcome to Training Center Ken! ~Paying It Forward, Here We Go~,” when you tap the “Maximum Region Effect” button in the region list dialog, the icon appears with a delay.\u003cbr> ・In the training event “You, Me, and Ramen” within the training scenario “Welcome to Toresen-ken! ~We’ve Started Paying It Forward~,” the positions of the images and text displayed in the choice options are incorrect.\u003cbr> ・In the training scenario “Welcome to Toresen-ken! ~We’ve Started Paying It Forward~,” the “Tasting Event Confirmation Dialog” for the Senior Class may display an unintended level of popularity.\u003cbr> ・On Trainer Business Cards and Club Business Cards, when displaying a business card image saved on the device, the position may be misaligned.\u003c/div>\u003cbr> [Updated September 2 at 2:05 PM]\u003cbr>\u003cdiv class=\"postscript-01\"> ・In Episode 2, “A Fine Lineup of Specialists,” of the story event “Go, Go, Kiraboshi Investigation Team!”, the display of some Umamusume characters is incorrect.\u003c/div>\u003cbr> [Updated September 1, 4:05 PM]\u003cbr>\u003cdiv class=\"postscript-01\"> ・In Self-Training, when training the following Umamusume, the stat values obtained from events may be unintended.\u003cbr> Mayano Top Gun\u003cbr> Meisho Doto\u003cbr> Sakura Laurel\u003c/div>\u003cbr>\u003cbr> ■ Issues for Which Fixes Will Not Be Implemented\u003cbr> Regarding the following phenomenon, we have decided not to implement a fix as this is by design.\u003cbr> [Updated 9/11 at 3:55 PM]\u003cbr>\u003cdiv class=\"postscript-01\"> ・When training \"Still in Love\" with the graphics quality set to \"Simplified,\" the screen may temporarily turn white when the pre-race training event begins.\u003c/div>\u003cbr>\u003cbr> We plan to fix this issue in a future update.\u003cbr> We ask for your patience until the fix is implemented.\u003cbr>\u003cbr> We apologize for any inconvenience this may cause to our users.","post_at":1614130800,"post_platform_flag":16,"row_number":2,"title":"現在確認している不具合について","title_english":"Regarding the Issues We Are Currently Investigating","update_at":1794564000},{"announce_id":3548,"announce_label":3,"article_image":null,"id":3,"image":"","label_color":"#FF911C","label_name_en":"Media","message":"いつも「ウマ娘 プリティーダービー」を応援いただきありがとうございます。\u003cbr>\u003cbr>本公演のチケットをご購入、またはJTBオフィシャルツアーにお申し込みいただいたお客様を対象に、旅費・キャンセル費等の返金および公演グッズ購入に関する詳細をご案内いたします。\u003cbr>当初予定していたメールでのご案内から、本ページでのご案内に変更とさせていただきます。\u003cbr>ご案内に大幅にお時間が掛かり、お待ちのお客様にご迷惑、ご心配をおかけしており誠に申し訳ございません。\u003cbr>\u003cbr>\u003cbr>返金または公演グッズの購入をご希望のお客様は、下記の詳細をご確認のうえ、記載の必要事項をCygames専用窓口までお送りくださいますようお願いいたします。\u003cbr>\u003cspan style=\"font-size: 12px;\">※すでにJTBからメールが届き、Cygames専用窓口へ必要事項をお送りいただいている場合、同じ内容を再度お送りいただく必要はございません。\u003cbr>※メールは、日本語または英語でお送りくださいますようお願いいたします。\u003c/span>\u003cbr>\u003cbr>\u003cstrong>■受付締切\u003c/strong>\u003cbr>2026年11月30日 23:59 PST（UTC−8／ロサンゼルス時間）\u003cbr>\u003cspan style=\"font-size: 12px;\">※日本時間：2026年12月1日 16:59（JST）\u003c/span>\u003cbr>\u003cbr>返金または公演グッズの通信販売での購入をご希望の方は、上記日時までに、下記の「ご回答いただきたい内容」をお送りください。\u003cbr>領収書などの資料や銀行口座情報は、今後のご案内に沿ってご提出ください。\u003cbr>\u003cspan style=\"font-size: 12px;\">※上記締切日経過後は、返金いたしかねる場合がございます。\u003c/span>\u003cbr>\u003cbr>なお、公演チケットおよびJTBオフィシャルツアーの代金は、AXSもしくはJTBより返金のご連絡をお送りしております。\u003cbr>\u003cbr>\u003cstrong>■返金額について\u003c/strong>\u003cbr>＜渡航された場合＞\u003cbr>・ロサンゼルスでの宿泊費\u003cbr>DAY1・DAY2のいずれか一方の公演に参加予定だった方は最大2泊分、両日の公演に参加予定だった方は最大3泊分の宿泊費の実費を返金いたします。\u003cbr>上限額は、1名あたり1泊につき、日本円で返金する場合は50,000円、米ドルで返金する場合は320米ドルです。\u003cbr>\u003cbr>・ロサンゼルスへの航空運賃\u003cbr>燃油サーチャージ・空港税等を含め、往復の航空運賃の実費を返金いたします。\u003cbr>上限額は、1名あたり往復につき、日本円で返金する場合は700,000円、米ドルで返金する場合は4,450米ドルです。\u003cbr>\u003cbr>＜渡航せず、ご予約をキャンセルされた場合＞\u003cbr>返金対象となる内容について、実際に発生したキャンセル費等を全額返金いたします。\u003cbr>この場合、上記の宿泊費・航空運賃の上限額は適用いたしません。\u003cbr>\u003cbr>＜JTBオフィシャルツアーにお申し込みの場合＞\u003cbr>ツアーに含まれる宿泊費・航空運賃は、JTBから全額返金いたします。\u003cbr>\u003cbr>\u003cstrong>■公演グッズの通信販売について\u003c/strong>\u003cbr>公演グッズの通信販売での購入をご希望の方には、お申し込み情報を確認のうえ、購入方法等を別途ご案内いたします。\u003cbr>\u003cbr>なお、発送先はアメリカ、カナダを除く地域となります。\u003cbr>アメリカ、カナダにお住まいの方は、以下の通信販売をご利用ください。\u003cbr>販売期間は2026年11月16日 23:59（PT）までです。\u003cbr>\u003ca href=\"https://www.goodsmileus.com/\" target=\"_blank\">https://www.goodsmileus.com/\u003c/a>\u003cbr>\u003cbr>\u003cstrong>■送信先\u003c/strong>\u003cbr>ts7th_umamusume_la_support@contact.cygames.co.jp\u003cbr>\u003cbr>\u003cstrong>■個人情報の取り扱い・第三者提供について\u003c/strong>\u003cbr>お送りいただいた個人情報は、株式会社Cygamesが、本件の返金および公演グッズの通信販売に関する対応のために利用いたします。\u003cbr>また、お申し込み情報の確認のため、お送りいただいた個人情報の一部を、お申し込み先であるAXS Group LLCおよびそのグループ会社、または株式会社JTBに提供いたします。\u003cbr>その他、個人情報の取り扱いについては、株式会社Cygamesのプライバシーポリシーをご確認ください。\u003cbr>\u003ca href=\"https://www.cygames.co.jp/policy/\" target=\"_blank\">https://www.cygames.co.jp/policy/\u003c/a>\u003cbr>\u003cbr>\u003cstrong>■ご回答いただきたい内容\u003c/strong>\u003cbr>以下をメール本文に貼り付け、各項目をご記入ください。\u003cbr>選択肢は、該当するものを残してください。\u003cbr>\u003cbr>【1】チケットの購入・ツアーのお申し込み先\u003cbr>AXS／JTB\u003cbr>\u003cbr>【2】公演チケットの座席番号（【1】で「AXS」を選択された方のみ）\u003cbr>公演日：\u003cbr>セクション（SECTION）：\u003cbr>列（ROW）：\u003cbr>座席番号（SEAT）：\u003cbr>\u003cbr>※複数の公演チケットをご購入の場合は、すべての公演チケットについてご記入ください。\u003cbr>\u003cbr>【3】旅費・キャンセル費等の返金\u003cbr>希望する／希望しない\u003cbr>\u003cbr>【4】公演グッズの通信販売での購入（アメリカ、カナダを除く地域への発送です）\u003cbr>希望する／希望しない\u003cbr>\u003cbr>【5】現在お住まいの国・地域\u003cbr>国・地域名：\u003cbr>\u003cbr>【6】AXSでのチケット購入時、またはツアーのお申し込み時のメールアドレス\u003cbr>メールアドレス：\u003cbr>\u003cbr>\u003cstrong>■ご連絡後の流れ\u003c/strong>\u003cbr>お送りいただいた内容を確認のうえ、Cygames専用窓口から、ご希望に応じたお手続きの詳細をご案内いたします。\u003cbr>\u003cbr>今回のメールでは、返金および公演グッズの通信販売での購入のご希望等を確認いたします。\u003cbr>領収書などの資料や銀行口座情報は、今後のご案内に沿ってご提出ください。\u003cbr>\u003cbr>お手数をおかけいたしますが、ご協力くださいますようお願い申し上げます。","message_english":"Thank you for your continued support of “Umamusume Pretty Derby.”\u003cbr>\u003cbr> For customers who purchased tickets for this performance or signed up for the JTB Official Tour, we would like to provide details regarding refunds for travel expenses, cancellation fees, and other matters, as well as information regarding the purchase of performance merchandise.\u003cbr> We have decided to provide this information on this page instead of via email as originally planned.\u003cbr> We sincerely apologize for the significant delay in providing this information and for any inconvenience or concern this may have caused to customers who have been waiting.\u003cbr>\u003cbr>\u003cbr> If you wish to request a refund or purchase event merchandise, please review the details below and send the required information to the Cygames dedicated contact point.\u003cbr>\u003cspan style=\"font-size: 12px;\">*If you have already received an email from JTB and submitted the required information to the Cygames dedicated contact point, there is no need to resubmit the same information. \u003cbr>*Please send your email in Japanese or English.\u003c/span>\u003cbr>\u003cbr>\u003cstrong>■Deadline\u003c/strong>\u003cbr> November 30, 2026, at 11:59 PM PST (UTC−8 / Los Angeles time)\u003cbr>\u003cspan style=\"font-size: 12px;\">*Japan Time: December 1, 2026, 4:59 PM (JST)\u003c/span>\u003cbr>\u003cbr> If you wish to receive a refund or purchase concert merchandise through our online store, please submit the “Information We Need from You” listed below by the deadline above.\u003cbr> Please submit supporting documents (such as receipts) and bank account information in accordance with future instructions.\u003cbr>\u003cspan style=\"font-size: 12px;\">*Please note that we may be unable to issue refunds after the above deadline has passed.\u003c/span>\u003cbr>\u003cbr> Please note that AXS or JTB has already sent refund notifications regarding the cost of concert tickets and the JTB Official Tour.\u003cbr>\u003cbr>\u003cstrong>■ Regarding Refund Amounts\u003c/strong>\u003cbr> &lt;If You Traveled&gt;\u003cbr> ・Accommodation expenses in Los Angeles\u003cbr> For those who were scheduled to attend either the DAY 1 or DAY 2 performance, we will refund the actual cost of up to 2 nights’ accommodation; for those who were scheduled to attend both performances, we will refund the actual cost of up to 3 nights’ accommodation.\u003cbr> The maximum refund per person per night is 50,000 yen if refunded in Japanese yen, or 320 U.S. dollars if refunded in U.S. dollars.\u003cbr>\u003cbr> ・Airfare to Los Angeles\u003cbr> We will reimburse the actual cost of round-trip airfare, including fuel surcharges, airport taxes, and other applicable fees.\u003cbr> The maximum refund amount per person per round trip is 700,000 yen if refunded in Japanese yen, or 4,450 U.S. dollars if refunded in U.S. dollars.\u003cbr>\u003cbr> &lt;If you cancel your reservation without traveling&gt;\u003cbr> For eligible items, we will refund the full amount of any cancellation fees actually incurred.\u003cbr> In this case, the maximum refund amounts for accommodation and airfare mentioned above do not apply.\u003cbr>\u003cbr> &lt;If you booked a JTB Official Tour&gt;\u003cbr> JTB will refund the full amount of the accommodation and airfare included in the tour.\u003cbr>\u003cbr>\u003cstrong>■ Regarding Mail-Order Sales of Concert Merchandise\u003c/strong>\u003cbr> For those wishing to purchase concert merchandise through mail order, we will review your application information and provide separate instructions regarding the purchase process.\u003cbr>\u003cbr> Please note that shipping is available only to regions other than the United States and Canada.\u003cbr> If you reside in the United States or Canada, please use the mail-order service listed below.\u003cbr> The sales period ends at 11:59 PM (PT) on November 16, 2026.\u003cbr>\u003ca href=\"https://www.goodsmileus.com/\" target=\"_blank\">https://www.goodsmileus.com/\u003c/a>\u003cbr>\u003cbr>\u003cstrong>■Mailing Address\u003c/strong>\u003cbr> ts7th_umamusume_la_support@contact.cygames.co.jp\u003cbr>\u003cbr>\u003cstrong>■Handling of Personal Information and Disclosure to Third Parties\u003c/strong>\u003cbr> Cygames, Inc. will use the personal information you submit to process refunds and handle mail-order sales of event merchandise related to this matter.\u003cbr> Additionally, to verify your application information, we will provide a portion of the personal information you submit to AXS Group LLC and its group companies, or to JTB Corporation, which is the entity receiving your application.\u003cbr> For further details regarding the handling of personal information, please refer to Cygames, Inc.’s Privacy Policy.\u003cbr>\u003ca href=\"https://www.cygames.co.jp/policy/\" target=\"_blank\">https://www.cygames.co.jp/policy/\u003c/a>\u003cbr>\u003cbr>\u003cstrong>■ Information We Need from You\u003c/strong>\u003cbr> Please copy and paste the text below into the body of your email and fill in each field.\u003cbr> Please select and leave the applicable options.\u003cbr>\u003cbr> [1] Where you purchased tickets or booked the tour\u003cbr> AXS / JTB\u003cbr>\u003cbr> [2] Seat number for the performance (only for those who selected “AXS” in [1])\u003cbr> Performance Date:\u003cbr> Section (SECTION):\u003cbr> Row (ROW):\u003cbr> Seat Number (SEAT):\u003cbr>\u003cbr> *If you purchased multiple performance tickets, please fill in the information for all of them.\u003cbr>\u003cbr> [3] Refunds for Travel Expenses, Cancellation Fees, etc.\u003cbr> Yes / No\u003cbr>\u003cbr> [4] Mail-Order Purchase of Performance Merchandise (Shipping to regions other than the U.S. and Canada)\u003cbr> Yes / No\u003cbr>\u003cbr> [5] Country or Region of Current Residence\u003cbr> Country/Region:\u003cbr>\u003cbr> [6] Email address used when purchasing tickets on AXS or registering for the tour\u003cbr> Email Address:\u003cbr>\u003cbr>\u003cstrong>■Next Steps After Contacting Us\u003c/strong>\u003cbr> After reviewing the information you submitted, the Cygames Dedicated Support Desk will contact you with details on how to proceed based on your request.\u003cbr>\u003cbr> In this email, we will confirm your requests regarding refunds and the purchase of event merchandise through mail order.\u003cbr> Please submit any supporting documents, such as receipts, and your bank account information as instructed in our future communications.\u003cbr>\u003cbr> We apologize for any inconvenience this may cause and appreciate your cooperation.","post_at":1794554880,"post_platform_flag":24,"row_number":3,"title":"『7th EVENT in LOS ANGELES』返金と公演グッズの通信販売に関するご案内","title_english":"Notice Regarding Refunds and Online Sales of Merchandise for the “7th EVENT in LOS ANGELES”","update_at":null},{"announce_id":3538,"announce_label":1,"article_image":null,"id":1,"image":"","label_color":"#B5D913","label_name_en":"Game","message":"育成シナリオ「駿大祭編」において、[真実一路]カルストンライトオの一部育成イベントに下記の不具合が発生しております。\u003cbr>\u003cbr>■不具合内容\u003cbr>育成イベント「いつかの『最高速』」が発生し、スピードおよび流鏑馬（※作中は点2つ）の演目稽古以外のトレーニングが制限されたターンにおいて、流鏑馬（※作中は点2つ）の演目稽古を実行した場合、育成イベント「今でも変わらないもの」が発生しない。\u003cbr>\u003cbr>修正による影響を考慮いたしまして、本不具合の修正は10/26より開催中の「トレーナー技能試験」終了後とさせていただきます。\u003cbr>また、本不具合の対応といたしまして、お詫びを予定しております。\u003cbr>対応が完了次第、本お知らせにてご報告いたします。\u003cbr>\u003cbr>【11/10 12:05追記】\u003cbr>本不具合の修正が完了いたしました。\u003cbr>\u003cbr>本不具合の対応といたしまして対象のお客様へお詫びをお送りいたしました。\u003cbr>お手数ではございますが、プレゼントからご確認ください。\u003cbr>\u003cbr>■不具合発生期間\u003cbr>10/26 12:00 ～ 11/10 11:30\u003cbr>\u003cbr>■対象のお客様\u003cbr>11/10 11:30までにゲームを開始されたお客様\u003cbr>\u003cbr>■お詫び内容\u003cbr>タフネス30×1\u003cbr>\u003cbr>ご利用のお客様に、ご迷惑をおかけしましたことを、お詫び申し上げます。","message_english":"In the training scenario \"Shundai Festival,\" the following issue has occurred in some training events for [One True Path] Calstone Light O.\u003cbr>\u003cbr> ■ Issue Details\u003cbr> When the training event “Some Day’s ‘Top Speed’” occurs, and training other than Speed and Yabusame (marked with two dots in-game) is restricted for a turn, if you perform the Yabusame (marked with two dots in-game) routine during that turn, the training event “What Remains Unchanged” will not trigger.\u003cbr>\u003cbr> Taking into account the impact of the fix, we will address this issue after the “Trainer Skills Test,” which has been underway since October 26, concludes.\u003cbr> Additionally, we plan to issue an apology in response to this issue.\u003cbr> We will report on this via this announcement as soon as the fix is complete.\u003cbr>\u003cbr> [Updated November 10 at 12:05 PM]\u003cbr> The fix for this issue has been completed.\u003cbr>\u003cbr> As a measure to address this issue, we have sent an apology to the affected customers.\u003cbr> We apologize for the inconvenience; please check your “Gift” section.\u003cbr>\u003cbr> ■ Period During Which the Issue Occurred\u003cbr> October 26, 12:00 PM – November 10, 11:30 AM\u003cbr>\u003cbr> ■ Affected Customers\u003cbr> Customers who started playing the game by 11:30 on November 10\u003cbr>\u003cbr> ■ Apology Details\u003cbr> Toughness ×30 (1)\u003cbr>\u003cbr> We sincerely apologize for any inconvenience this may have caused our players.","post_at":1793776560,"post_platform_flag":56,"row_number":4,"title":"育成シナリオ「駿大祭編」におけるカルストンライトオの一部育成イベントの不具合について","title_english":"Regarding a Bug in Some Training Events for Calstone Light O in the \"Shundai Festival\" Training Scenario","update_at":1794279900},{"announce_id":3540,"announce_label":1,"article_image":null,"id":1,"image":"https://prd-info-umamusume.akamaized.net/announce/3540/Thumbnail/banner_31200006.png?c=20261105120328","label_color":"#B5D913","label_name_en":"Game","message":"11/10 12:00から、イベント「アグネスタキオンの因子研究」を開催中です！\u003cbr>\u003cbr>本イベントでは、研究ゲージを溜めることで「因子研究レポート」などのさまざまな報酬を獲得できます。\u003cbr>「因子研究レポート」を使用することで、殿堂入りウマ娘や継承専用ウマ娘の一部因子を強化できます。\u003cbr>\u003cbr>本イベントで獲得した「因子研究レポート」を使用できるのは、本イベントの因子強化期間が終了するまでです。\u003cbr>※「因子研究レポート」は、イベント開催期間中も使用できます。\u003ch2 class=\"heading\">イベント開催期間\u003c/h2>11/10 12:00 ～ 11/19 11:59\u003ch2 class=\"heading\">報酬受取・因子強化期間\u003c/h2>11/19 12:00 ～ 11/22 11:59\u003ch2 class=\"heading\">研究ゲージ\u003c/h2>研究ゲージを溜められるのは、下記です。\u003cbr>・育成\u003cbr>・全国興行\u003cbr>・チーム競技場\u003cbr>・デイリーレース\u003cbr>・デイリーレジェンドレース\u003ch3 class=\"subheading\">研究成果報酬\u003c/h3>研究ゲージが1本以上溜まった状態でイベントトップ画面に移動することで、溜まった研究ゲージの本数に応じた研究成果報酬が獲得できます。\u003ch2 class=\"heading\">因子強化について\u003c/h2>本イベントでは、「因子研究レポート」を使用し、殿堂入りウマ娘や継承専用ウマ娘の因子強化ができます。\u003cbr>因子強化をすると因子の★を増やせます。\u003ch3 class=\"subheading\">因子研究レポートで強化できる因子\u003c/h3>・基礎能力因子\u003cbr>・適性因子\u003cbr>・固有因子\u003cbr>※汎用因子は強化できません。\u003ch2 class=\"heading\">注意事項\u003c/h2>1. イベントについての詳細は、イベント「アグネスタキオンの因子研究」のトップ画面右上の[ヘルプ]をご確認ください。\u003cbr>2. イベント開催期間および内容は、予告なく変更する場合がございます。\u003cbr>3. 本イベントで獲得した「因子研究レポート」は、次回のイベントに持ち越せません。\u003cbr>4. 因子を★4以上にはできません。\u003cbr>5. 開催期間を過ぎてから育成およびレースを完了した場合、研究ゲージは上昇しません。\u003cbr>6. 育成中のウマ娘の継承ウマ娘に因子強化をした場合、その育成では継承ウマ娘への因子強化は反映されません。\u003cbr>※継承ウマ娘は、育成開始時の因子の状態が適用されます。\u003cbr>7. 殿堂入りウマ娘や継承専用ウマ娘の継承元となったウマ娘に因子強化をした場合、その殿堂入りウマ娘や継承専用ウマ娘の因子に因子強化は反映されません。\u003cbr>8. 「因子研究レポート」の類似アイテム「因子強化レポート」は、本イベント画面からは使用できません。 [メニュー]＞[持ち物/変換]＞[消費アイテム]から使用してください。","message_english":"The \"Agnes Tachyon's Factor Research\" event is now underway, starting at 12:00 on November 10!\u003cbr>\u003cbr> In this event, you can earn various rewards, such as “Factor Research Reports,” by filling the research gauge.\u003cbr> By using “Factor Research Reports,” you can enhance certain factors of Hall of Fame Umamusume and Umamusume designated for inheritance.\u003cbr>\u003cbr> \"Factor Research Reports\" obtained during this event can only be used until the event’s factor enhancement period ends.\u003cbr> *“Factor Research Reports” can be used even while the event is still active.\u003ch2 class=\"heading\"> Event Period\u003c/h2> November 10, 12:00 PM – November 19, 11:59 AM\u003ch2 class=\"heading\"> Reward Claim &amp; Factor Enhancement Period\u003c/h2> November 19, 12:00 PM – November 22, 11:59 AM\u003ch2 class=\"heading\"> Research Gauge\u003c/h2> You can accumulate Research Gauge through the following:\u003cbr> ・Training\u003cbr> ・National Tournaments\u003cbr> ・Team Arena\u003cbr> ・Daily Races\u003cbr> ・Daily Legend Race\u003ch3 class=\"subheading\"> Research Rewards\u003c/h3> If you navigate to the event top screen while having at least one Research Gauge bar filled, you will receive Research Achievement Rewards based on the number of filled Research Gauge bars.\u003ch2 class=\"heading\"> About Factor Enhancement\u003c/h2> In this event, you can use “Factor Research Reports” to enhance the factors of Hall of Fame Umamusume and Umamusume designated for inheritance.\u003cbr> Enhancing factors increases their star rating.\u003ch3 class=\"subheading\"> Factors That Can Be Enhanced with Factor Research Reports\u003c/h3> ・Basic Ability Factors\u003cbr> ・Aptitude Factors\u003cbr> ・Unique Factors\u003cbr> *General Factors cannot be enhanced.\u003ch2 class=\"heading\"> Important Notes\u003c/h2> 1. For details about the event, please check the [Help] link in the upper-right corner of the main screen for the event “Agnes Tachyon’s Factor Research.”\u003cbr> 2. The event period and content are subject to change without notice.\u003cbr> 3. “Factor Research Reports” obtained in this event cannot be carried over to the next event.\u003cbr> 4. Factors cannot be upgraded to ★4 or higher.\u003cbr> 5. If you complete training or a race after the event period has ended, the Research Gauge will not increase.\u003cbr> 6. If you enhance the factors of an inherited Umamusume while training another Umamusume, the factor enhancements will not be applied to the inherited Umamusume during that training session.\u003cbr> *For inherited Umamusume, the factor status at the start of training applies.\u003cbr> 7. If you enhance the factors of an Umamusume that served as the source for a Hall of Fame Umamusume or an Inheritance-Exclusive Umamusume, the factor enhancement will not be reflected in the factors of that Hall of Fame Umamusume or Inheritance-Exclusive Umamusume.\u003cbr> 8. The “Factor Enhancement Report,” which is similar to the “Factor Research Report,” cannot be used from this event screen. Please use it via [Menu] &gt; [Inventory/Convert] &gt; [Consumable Items].","post_at":1794279600,"post_platform_flag":62,"row_number":5,"title":"イベント「アグネスタキオンの因子研究」開催中！","title_english":"The \"Agnes Tachyon Factor Research\" event is now underway!","update_at":null},{"announce_id":3536,"announce_label":1,"article_image":null,"id":1,"image":"https://prd-info-umamusume.akamaized.net/announce/3536/Thumbnail/announce_banner_5254.png?c=20261105120608","label_color":"#B5D913","label_name_en":"Game","message":"11/10 12:00から、「セレクトピックアップ スタンプシートガチャ」（略称：「スタンプシートガチャ」）を開催しております。\u003cbr>\u003cbr>「スタンプシートガチャ」は、ガチャを引くごとに虹の結晶片などの豪華報酬を獲得できる「スタンプシート機能」と、「セレクトピックアップ機能」がセットになったガチャです。\u003cbr>『5回引く!』（有償ジュエル750個）と、スタンプが10個貯まるごとに解放される、ピックアップSSR確定の『10回引く!』（有償ジュエル1500個）が利用できます。\u003ch2 class=\"heading\">スタンプシート機能について\u003c/h2>「スタンプシートガチャ」では『5回引く!』と『10回引く!』のいずれかのガチャを引くごとにスタンプシートにスタンプが押されます。\u003cbr>スタンプシートに押されたスタンプの合計数に応じて、報酬を獲得できます。\u003cbr>スタンプが押される数は毎回抽選になっており、スタンプ個数の提供割合に基づき、1～5個のスタンプが押されます。\u003cbr>『10回引く!』はスタンプを合計10個獲得するごとに1回分が解放され、最大で3回まで引くことができます。\u003cbr>※『10回引く!』が解放されるまでは、『5回引く!』のみ引くことができます。\u003cbr>※『10回引く!』が解放された場合、『10回引く!』を引くまでは、『5回引く!』を引くことができません。\u003cbr>※3回目の『10回引く!』を引いた場合、以降は『5回引く!』と『10回引く!』のいずれも引くことができません。\u003cbr>\u003cbr>『10回引く!』の10回目には、「ピックアップ選択サポートカード」として選択した3枚のSSRサポートカードのいずれかを確定で獲得できます。\u003cbr>スタンプシートは最大4シートまであり、獲得できるスタンプ報酬の詳細は、ガチャ画面の右下の『スタンプ報酬』ボタンから確認できます。\u003cbr>\u003ch2 class=\"heading\">スタンプ個数の提供割合\u003c/h2>\u003ctable class=\"SelectStepupInfoTable\">\u003cthead>\u003ctr>\u003cth>スタンプ個数\u003c/th>\u003cth>提供割合\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1個\u003c/td>\u003ctd>45.000％\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2個\u003c/td>\u003ctd>35.000％\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3個\u003c/td>\u003ctd>15.000％\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4個\u003c/td>\u003ctd>3.000％\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5個\u003c/td>\u003ctd>2.000％\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>※『5回引く!』と『10回引く!』で獲得できるスタンプ個数の提供割合はどちらも同じです。\u003cbr>\u003ch2 class=\"heading\">セレクトピックアップ機能について\u003c/h2>「スタンプシートガチャ」では、下記「■ピックアップサポートカード候補」に記載のSSRサポートカードの中から3枚を選び、「ピックアップ選択サポートカード」として設定できます。\u003cbr>「ピックアップ選択サポートカード」として設定したカードは、提供割合がアップします。\u003cbr>\u003cbr>出現するサポートカードは2026/9/30までに開催されたガチャでリリースされたサポートカードです。\u003cbr>詳細は、ガチャ画面右上の[ガチャ詳細]、[サポートカード詳細]をご確認ください。\u003cbr>※「ピックアップ選択サポートカード」は必ず3枚選択する必要があります。\u003cbr>※「ピックアップ選択サポートカード」は設定後、いつでも変更できます。\u003cbr>※「ピックアップ選択サポートカード」に選ばなかった「■ピックアップサポートカード候補」に記載のSSRサポートカードも、ガチャから出現します。\u003cbr>※『10回引く!』の10回目には、「ピックアップ選択サポートカード」として選択した3枚のSSRサポートカードのいずれかを確定で獲得できます。\u003cbr>\u003ch2 class=\"heading\">開催期間\u003c/h2>11/10 12:00 ～ 12/28 11:59\u003cbr>\u003ch2 class=\"heading\">サポートカード\u003c/h2>\u003cfigure>\u003cimg src=\"https://prd-info-umamusume.akamaized.net/announce/3536/Header/gacha_banner_50254.png?c=20261105120608\">\u003c/figure>■ピックアップサポートカード候補\u003cbr>・SSR [As if Guided]エフフォーリア\u003cbr>・SSR [行き先はあたたかな場所]マチカネタンホイザ\u003cbr>・SSR [時に交わる海と空]ミスターシービー\u003cbr>・SSR [永久の誓い、永久の輝き]サトノダイヤモンド\u003cbr>・SSR [刀光散らしてClash！]タップダンスシチー\u003cbr>・SSR [心覚えし、京の華]エアグルーヴ\u003cbr>・SSR [天才的ユートピア]トウカイテイオー\u003cbr>・SSR [氷結晶の静域]アドマイヤグルーヴ\u003cbr>・SSR [響け、二人の凱歌]マルシュロレーヌ\u003cbr>・SSR [吉兆招福チョコ来たる]マチカネフクキタル\u003cbr>・SSR [その執念は怒濤が如く]メイショウドトウ\u003cbr>・SSR [巻頭カラーの夏]キセキ\u003cbr>・SSR [賑やかな未来を乗せて走れ！]サクラチヨノオー\u003cbr>・SSR [ぬくもりのノエル]フェノーメノ\u003cbr>・SSR [激録！爆走トナカイ事件]ゴールドシップ\u003cbr>・SSR [スマイル・エバーアフター]グランアレグリア\u003cbr>・SSR [全てに挑む勇ましき者]アグネスデジタル\u003cbr>・SSR [ゆかし、きらめきの旅路]ファインモーション\u003cbr>・SSR [単焦点でつかまえて]アストンマーチャン\u003cbr>・SSR [白に至る純真]デアリングタクト\u003cbr>・SSR [白に至る覚悟]デアリングハート\u003cbr>・SSR [夏空チルタイム]アーモンドアイ\u003cbr>・SSR [気まぐれ渡り星]ステイゴールド\u003cbr>・SSR [両手いっぱい、小倉愛]ナイスネイチャ\u003cbr>・SSR [Innovator]フォーエバーヤング\u003ch2 class=\"heading\">注意事項\u003c/h2>1. 「スタンプシートガチャ」では「サポートカード交換Pt」は獲得できません。\u003cbr>2. 獲得したスタンプ報酬は、プレゼントに送られます。\u003cbr>3. プレゼントに送られたスタンプ報酬には、受け取り期限はございません。\u003cbr>4. ガチャの詳細、提供割合およびその他の注意事項は、ガチャ画面上部の[ガチャ詳細]からご確認ください。\u003cbr>5. 開催期間および内容は、予告なく変更する場合がございます。","message_english":"Starting at 12:00 on November 10, we are holding the “Select Pickup Stamp Sheet Gacha” (abbreviated as “Stamp Sheet Gacha”).\u003cbr>\u003cbr> The “Stamp Sheet Gacha” is a gacha that combines the “Stamp Sheet Feature”—which lets you earn generous rewards such as Rainbow Crystal Shards with every pull—with the “Select Pickup Feature.”\u003cbr> You can choose between “5 Pulls!” (750 Premium Gems) and “10 Pulls!” (1,500 Premium Gems), which unlocks a guaranteed SSR from the Pickup pool every time you collect 10 stamps.\u003ch2 class=\"heading\"> About the Stamp Sheet Feature\u003c/h2> In the “Stamp Sheet Gacha,” a stamp is added to your stamp sheet every time you draw from either the “5 Draws!” or “10 Draws!” gacha.\u003cbr> You can earn rewards based on the total number of stamps collected on your stamp sheet.\u003cbr> The number of stamps awarded is determined by a random draw each time; based on the probability distribution, you will receive between 1 and 5 stamps.\u003cbr> For “Draw 10 Times!”, one draw is unlocked for every 10 stamps you collect, and you can draw up to a maximum of 3 times.\u003cbr> *Until “10-Draw!” is unlocked, you can only use “5-Draw!”.\u003cbr> *Once “10 Draws!” is unlocked, you cannot use “5 Draws!” until you have used “10 Draws!”\u003cbr> *Once you’ve drawn “10 Draws!” for the third time, you will no longer be able to draw either “5 Draws!” or “10 Draws!”\u003cbr>\u003cbr> On the 10th “10-Draw!” pull, you are guaranteed to receive one of the three SSR Support Cards you selected as “Pickup Support Cards.”\u003cbr> There are up to 4 stamp sheets available, and you can view details on the stamp rewards you can earn by tapping the “Stamp Rewards” button in the bottom-right corner of the gacha screen.\u003cbr>\u003ch2 class=\"heading\"> Stamp Count Distribution Rates\u003c/h2>\u003ctable class=\"SelectStepupInfoTable\">\u003cthead>\u003ctr>\u003cth> Number of Stamps\u003c/th>\u003cth> Drop Rate\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd> 1 Stamp\u003c/td>\u003ctd> 45.000%\u003c/td>\u003c/tr>\u003ctr>\u003ctd> 2\u003c/td>\u003ctd> 35.000%\u003c/td>\u003c/tr>\u003ctr>\u003ctd> 3 items\u003c/td>\u003ctd> 15.000%\u003c/td>\u003c/tr>\u003ctr>\u003ctd> 4 items\u003c/td>\u003ctd> 3.000%\u003c/td>\u003c/tr>\u003ctr>\u003ctd> 5 items\u003c/td>\u003ctd> 2.000%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table> *The distribution of stamps you can earn from “Draw 5 Times!” and “Draw 10 Times!” is the same for both.\u003cbr>\u003ch2 class=\"heading\"> About the Select Pickup Feature\u003c/h2> In the “Stamp Sheet Gacha,” you can select 3 SSR Support Cards from the list of “■ Pickup Support Card Candidates” below and set them as “Pickup Support Cards.”\u003cbr> The drop rate for cards set as “Pickup Support Cards” will be increased.\u003cbr>\u003cbr> The Support Cards that can appear are those released in Gachas held up to September 30, 2026.\u003cbr> For details, please check [Gacha Details] and [Support Card Details] in the upper-right corner of the gacha screen.\u003cbr> *You must select exactly 3 “Pickup Support Cards.”\u003cbr> * You can change your “Featured Support Cards” at any time after setting them.\u003cbr> * SSR Support Cards listed under “■ Featured Support Card Candidates” that were not selected as “Featured Support Cards” may also appear in the gacha.\u003cbr> * On the 10th pull of “10 Pulls!”, you are guaranteed to receive one of the three SSR Support Cards you selected as your “Pickup Selection Support Cards.”\u003cbr>\u003ch2 class=\"heading\"> Event Period\u003c/h2> November 10, 12:00 PM – December 28, 11:59 AM\u003cbr>\u003ch2 class=\"heading\"> Support Cards\u003c/h2>\u003cfigure>\u003cimg src=\"https://prd-info-umamusume.akamaized.net/announce/3536/Header/gacha_banner_50254.png?c=20261105120608\">\u003c/figure> ■ Featured Support Card Candidates\u003cbr> ・SSR [As if Guided] Efforia\u003cbr> ・SSR [Destination: A Warm Place] Matikanetannhauser\u003cbr> ・SSR [Where Sea and Sky Meet] Mr. C.B.\u003cbr> ・SSR [Eternal Vow, Eternal Radiance] Satono Diamond\u003cbr> ・SSR [Blade Light Scatters—Clash!] Tap Dance City\u003cbr> ・SSR [Etched in My Heart: The Splendor of Kyoto] Air Groove\u003cbr> ・SSR [Genius Utopia] Tokai Teio\u003cbr> ・SSR [The Serene Realm of Ice Crystals] Admire Groove\u003cbr> ・SSR [Let Their Triumphant Hymn Ring Out] Marche Lorraine\u003cbr> ・SSR [Auspicious Chocolate Brings Good Fortune] Matikane​fukukitaru\u003cbr> ・SSR [That Determination Is Like a Raging Torrent] Meisho Doto\u003cbr> ・SSR [Summer on the Front Cover] Kiseki\u003cbr> ・SSR [Race Toward a Vibrant Future!] Sakura Chiyono O\u003cbr> ・SSR [A Warm Christmas] Fenomeno\u003cbr> ・SSR [The Sensational Tale! The Speeding Reindeer Incident] Gold Ship\u003cbr> ・SSR [Smile Ever After] Gran Alegria\u003cbr> ・SSR [The Brave One Who Takes on Everything] Agnes Digital\u003cbr> ・SSR [A Charming, Sparkling Journey] Fine Motion\u003cbr> ・SSR [Capture It with a Prime Lens] Aston Machan\u003cbr> ・SSR [Purity Leading to White] Daring Tact\u003cbr> ・SSR [Resolve to Reach White] Daring Heart\u003cbr> ・SSR [Summer Sky Chill Time] Almond Eye\u003cbr> ・SSR [Capricious Shooting Star] Stay Gold\u003cbr> ・SSR [Arms Full of Ogura Love] Nice Nature\u003cbr> ・SSR [Innovator] Forever Young\u003ch2 class=\"heading\"> Important Notes\u003c/h2> 1. You cannot earn “Support Card Exchange Points” from the “Stamp Sheet Gacha.”\u003cbr> 2. Earned stamp rewards will be sent to your “Gift” section.\u003cbr> 3. There is no expiration date for stamp rewards sent to your “Gift” section.\u003cbr> 4. For gacha details, drop rates, and other important notes, please check [Gacha Details] at the top of the gacha screen.\u003cbr> 5. The event period and content are subject to change without prior notice.","post_at":1794279600,"post_platform_flag":62,"row_number":6,"title":"セレクトピックアップ スタンプシートガチャ開催！","title_english":"\"Select Pickup\" Stamp Sheet Gacha Event Now Live!","update_at":null},{"announce_id":3535,"announce_label":1,"article_image":null,"id":1,"image":"https://prd-info-umamusume.akamaized.net/announce/3535/Thumbnail/announce_banner_3482.png?c=20261104123702","label_color":"#B5D913","label_name_en":"Game","message":"11/10 12:00から、「ピックアップ プリティーダービーガチャ」と「ピックアップ サポートカードガチャ」が開催しました。\u003cbr>それぞれ新たな育成ウマ娘とサポートカードが登場します。\u003cbr>\u003cbr>ピックアップ期間中は、対象の育成ウマ娘とサポートカードの提供割合がアップします。\u003cbr>\u003cbr>さらに、ピックアップ期間中に対象の★3育成ウマ娘を獲得すると、その育成ウマ娘の専用ピースをおまけとして通常より多く獲得できます。\u003cbr>開催期間中は、対象の★3育成ウマ娘を獲得するたびに、何度でもおまけを獲得できます。\u003cbr>「育成ウマ娘交換Pt」を消費して対象の★3育成ウマ娘を獲得した場合でも、おまけを獲得できます。\u003cbr>\u003cbr>ピックアップ対象の育成ウマ娘とサポートカードは以下のとおりです。\u003ch2 class=\"heading\">ピックアップガチャ開催期間\u003c/h2>11/10 12:00 ～ 11/19 11:59\u003cbr>\u003ch2 class=\"heading\">育成ウマ娘\u003c/h2>\u003cfigure>\u003cimg src=\"https://prd-info-umamusume.akamaized.net/announce/3535/Header/gacha_banner_30482.png?c=20261104123702\">\u003c/figure>■新登場の育成ウマ娘（ピックアップ対象）\u003cbr>★★★ [熟れしめでたし実り姫]ユキノビジン\u003cbr>\u003cbr>■ピックアップ対象の育成ウマ娘\u003cbr>★★★ [熟れしめでたし実り姫]ユキノビジン\u003cbr>＜おまけ内容＞\u003cbr>[熟れしめでたし実り姫]ユキノビジンのピース×90\u003ch2 class=\"heading\">サポートカード\u003c/h2>\u003cfigure>\u003cimg src=\"https://prd-info-umamusume.akamaized.net/announce/3535/Header/gacha_banner_30483.png?c=20261104123702\">\u003c/figure>■新登場のサポートカード（ピックアップ対象）\u003cbr>・SSR [馳せて奪うは映山紅]ノーリーズン\u003cbr>・SR [黄昏に馳せる追憶]ステイゴールド\u003ch2 class=\"heading\">注意事項\u003c/h2>1. 「育成ウマ娘交換Pt」および「サポートカード交換Pt」は、開催中のほかのガチャや、次回以降のガチャに引き継がれません。\u003cbr>2. ガチャ開催期間中に使用しなかった200Pt未満の「育成ウマ娘交換Pt」および「サポートカード交換Pt」は、ガチャ終了後に自動で「クローバー」へと変換されます。\u003cbr>3. ガチャの詳細、提供割合およびその他の注意事項は、ガチャ画面上部の[ガチャ詳細]からご確認ください。\u003cbr>4. 継承スキルの詳細は、ガチャ画面右上の[育成ウマ娘詳細]＞[スキル詳細]からご確認ください。\u003cbr>5. 開催期間および内容は、予告なく変更する場合がございます。\u003ch2 class=\"heading\">ウマ娘ストーリー解放キャンペーン\u003c/h2>\u003cfigure>\u003cimg src=\"https://prd-info-umamusume.akamaized.net/announce/3535/Header/header_40200002.png?c=20261104123702\">\u003c/figure>[熟れしめでたし実り姫]ユキノビジンの登場を記念して、ユキノビジンのウマ娘ストーリー第1話～第4話を期間限定で解放します。\u003cbr>解放期間中は、ストーリーの解放条件を満たしていない場合でも視聴できます。\u003ch2 class=\"heading\">ウマ娘ストーリー解放期間\u003c/h2>11/10 12:00 ～ 11/19 11:59\u003cbr>\u003ch2 class=\"heading\">対象ウマ娘\u003c/h2>・ユキノビジン\u003ch2 class=\"heading\">注意事項\u003c/h2>1. ストーリー解放期間中は、対象ウマ娘を獲得していなくても、ウマ娘ストーリー第1話～第4話を視聴できます。\u003cbr>2. 解放期間中に対象ウマ娘のウマ娘ストーリー第1話～第4話を視聴した場合は、「初回ジュエル報酬の獲得」、「ウマ娘ストーリーの獲得」、「ウマ娘名鑑の経験値獲得」のすべてが適用されます。\u003cbr>3. 解放期間中に対象ウマ娘のウマ娘ストーリー第1話～第4話を視聴しなかった場合は、「初回ジュエル報酬の獲得」、「ウマ娘ストーリーの獲得」、「ウマ娘名鑑の経験値獲得」は適用されません。\u003cbr>4. 解放期間終了後は、視聴していない対象ウマ娘のウマ娘ストーリーは解放されていない状態に戻ります。\u003cbr>5. ウマ娘ストーリーは、チュートリアル完了後に視聴できます。","message_english":"Starting at 12:00 on November 10, the “Pickup Pretty Derby Gacha” and “Pickup Support Card Gacha” went live.\u003cbr> New trainable Umamusume and support cards will be introduced in each gacha.\u003cbr>\u003cbr> During the Pickup period, the drop rates for eligible Training Umamusume and Support Cards will be increased.\u003cbr>\u003cbr> Additionally, if you obtain a featured ★3 Training Umamusume during the Pickup period, you’ll receive more of that Training Umamusume’s exclusive pieces as a bonus than usual.\u003cbr> You can receive this bonus as many times as you like whenever you obtain an eligible ★3 Training Umamusume during the event period.\u003cbr> You can also receive the bonus if you use “Training Umamusume Exchange Points” to obtain an eligible ★3 Training Umamusume.\u003cbr>\u003cbr> The featured Training Umamusume and Support Cards are as follows.\u003ch2 class=\"heading\"> Featured Gacha Event Period\u003c/h2> November 10 at 12:00 PM – November 19 at 11:59 AM\u003cbr>\u003ch2 class=\"heading\"> Training Umamusume\u003c/h2>\u003cfigure>\u003cimg src=\"https://prd-info-umamusume.akamaized.net/announce/3535/Header/gacha_banner_30482.png?c=20261104123702\">\u003c/figure> ■ Newly Added Training Umamusume (Featured)\u003cbr> ★★★ [The Ripe and Blessed Princess of Harvest] Yukino Bijin\u003cbr>\u003cbr> ■ Training Umamusume Featured in the Pickup\u003cbr> ★★★ [The Blessed Princess of Ripened Harvest] Yukino Bijin\u003cbr> &lt;Bonus Contents&gt;\u003cbr> [The Blessed Princess of the Ripe Harvest] Yukino Bijin Pieces ×90\u003ch2 class=\"heading\"> Support Cards\u003c/h2>\u003cfigure>\u003cimg src=\"https://prd-info-umamusume.akamaized.net/announce/3535/Header/gacha_banner_30483.png?c=20261104123702\">\u003c/figure> ■New Support Cards (Featured)\u003cbr> ・SSR [Rushing to Seize the Azalea] No Reason\u003cbr> ・SR [Memories Racing Toward Twilight] Stay Gold\u003ch2 class=\"heading\"> Important Notes\u003c/h2> 1. “Umamusume Training Exchange Points” and “Support Card Exchange Points” will not carry over to other currently active gacha events or to future gacha events.\u003cbr> 2. Any “Umamusume Training Exchange Points” and “Support Card Exchange Points” totaling less than 200 points that are not used during the gacha event period will be automatically converted to “Clover” after the gacha ends.\u003cbr> 3. Please check [Gacha Details] at the top of the gacha screen for details, drop rates, and other important notes.\u003cbr> 4. For details on inherited skills, please check [Training Umamusume Details] &gt; [Skill Details] in the upper-right corner of the gacha screen.\u003cbr> 5. The event period and content are subject to change without prior notice.\u003ch2 class=\"heading\"> Umamusume Story Unlock Campaign\u003c/h2>\u003cfigure>\u003cimg src=\"https://prd-info-umamusume.akamaized.net/announce/3535/Header/header_40200002.png?c=20261104123702\">\u003c/figure> To commemorate the debut of [The Ripe and Blessed Princess of the Harvest] Yukino Bijin, Chapters 1 through 4 of Yukino Bijin’s Umamusume Story will be unlocked for a limited time.\u003cbr> During the unlock period, you can view the story even if you haven’t met the unlock conditions.\u003ch2 class=\"heading\"> Umamusume Story Unlock Period\u003c/h2> November 10, 12:00 PM – November 19, 11:59 AM\u003cbr>\u003ch2 class=\"heading\"> Eligible Umamusume\u003c/h2> ・Yukino Bijin\u003ch2 class=\"heading\"> Important Notes\u003c/h2> 1. During the story unlock period, you can watch Chapters 1–4 of the Umamusume Story even if you haven’t obtained the eligible Umamusume.\u003cbr> 2. If you watch Chapters 1–4 of an eligible Umamusume’s story during the unlock period, you will receive all of the following: the “First-Time Jewel Reward,” the “Umamusume Story,” and “Umamusume Encyclopedia Experience Points.”\u003cbr> 3. If you do not watch Chapters 1–4 of an eligible Umamusume’s story during the unlock period, you will not receive the “First-Time Jewel Reward,” “Umamusume Story,” or “Umamusume Encyclopedia Experience Points.”\u003cbr> 4. After the unlock period ends, the Umamusume Stories for eligible Umamusume characters that you have not watched will revert to their locked state.\u003cbr> 5. You can watch the Umamusume Story after completing the tutorial.","post_at":1794279600,"post_platform_flag":62,"row_number":7,"title":"育成ウマ娘&サポートカード新登場！ピックアップガチャ開催！","title_english":"New Umamusume Training & Support Cards Are Here! Picku
