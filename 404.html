<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Urara</title>
    <script>
      // GitHub Pages serves this page for any deep link. Forward the full
      // path, query and hash to the app, which restores it (see src/lib/redirect.ts).
      var l = window.location;
      l.replace(
        l.origin + "/Urara/?p=" + encodeURIComponent(l.pathname + l.search + l.hash),
      );
    </script>
  </head>
</html>
